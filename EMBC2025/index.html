<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matteo Leccardi | EMBC 2025</title>
    <meta name="description" content="Matteo Leccardi's page for EMBC 2025.">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="./css/app.css">
    <script src="./js/app.js" type="module" defer></script>
</head>
<body>
    

    <div class="instructions">
        You will be showed a picture that is a slice of a CT scan of the heart. 
        Please select where the indicated coronary ostium is.
    </div>
    <button class="start">
        Let's Start!
    </button>


    <h1 class="title" style="display: none;">Please select the right coronary ostium.</h1>


    <div class="slice-canva" style="display: none; width: 100; aspect-ratio: 1; background-color: aqua; max-width: 10cm;">

    </div>

    <div class="bullet" style="
        position: fixed; 
        width: 8px; 
        height: 8px; 
        border-radius: 10px; 
        background: firebrick; 
        z-index: 10; 
        display:none;
        transform: translateX(-50%) translateY(-50%);
    "></div>

    <button class="action" style="display: none;">
        Save
    </button>


</body>
</html>
